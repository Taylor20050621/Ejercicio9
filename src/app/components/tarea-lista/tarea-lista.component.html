<!-- src/app/components/tarea-lista/tarea-lista.component.html -->
<!-- SECCIÓN 6.2: Plantilla HTML con Pipe Async (| async) -->
<!-- El Pipe Async realiza la suscripción y des-suscripción automática. -->

<div class="container">
  <h2>Lista de Tareas (Consumo Reactivo con Pipe Async)</h2>

  <div *ngIf="tareas$ | async as tareas; else cargando">
    <table class="tabla-spa">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Descripción</th>
          <th>Prioridad</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of tareas">
          <td>{{ t.id }}</td>
          <td>{{ t.titulo }}</td>
          <td>{{ t.descripcion }}</td>
          <td>{{ t.prioridad }}</td>
          <td>{{ t.completada ? 'Completada' : 'Pendiente' }}</td>
          <td>
            <button (click)="eliminar(t.id)" class="btn-borrar">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #cargando>
    <p class="cargando-text">Cargando datos desde el Servicio REST...</p>
  </ng-template>
</div>
